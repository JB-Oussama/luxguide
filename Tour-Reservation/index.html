<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LuxGuide Tour Booking</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    h1, h2 {
      color: #333;
      text-align: center;
    }
    form {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, select, textarea, button {
      padding: 10px;
      width: 100%;
      box-sizing: border-box;
      margin-top: 5px;
    }
    textarea {
      resize: vertical;
      height: 80px;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background-color: #218838;
    }
    .success-message {
      background-color: #d4edda;
      color: #155724;
      padding: 10px;
      margin-top: 20px;
      border-radius: 5px;
      display: none;
    }
    .error-message {
      background-color: #f8d7da;
      color: #721c24;
      padding: 10px;
      margin-top: 20px;
      border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>LuxGuide Tour Booking</h1>

  <form id="reservationForm">
    <label for="name">Name:</label>
    <input type="text" id="name" required />

    <label for="email">Email:</label>
    <input type="email" id="email" required />

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" required />

    <label for="adults">Number of Adults:</label>
    <input type="number" id="adults" required min="1" />

    <label for="pricePerAdult">Price Per Adult:</label>
    <input type="number" id="pricePerAdult" required min="1" placeholder="Enter price per adult" />

    <label for="startDate">Start Date:</label>
    <input type="date" id="startDate" required />

    <label for="endDate">End Date:</label>
    <input type="date" id="endDate" required />

    <label for="status">Status:</label>
    <select id="status" required>
      <option value="Confirmed">Confirmed</option>
      <option value="Canceled">Canceled</option>
    </select>

    <label for="notes">Notes:</label>
    <textarea id="notes" placeholder="Add special notes or requests..."></textarea>

    <button type="submit">Book Tour</button>

    <div class="success-message" id="successMessage">Booking submitted successfully!</div>
    <div class="error-message" id="errorMessage">Something went wrong. Please try again.</div>
  </form>

  <script>
    const form = document.getElementById('reservationForm');
    const successMessage = document.getElementById('successMessage');
    const errorMessage = document.getElementById('errorMessage');

    const SHEET_BEST_URL = 'https://api.sheetbest.com/sheets/13d68a92-7362-45f4-913f-bbcc0ed34cab';

    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      // Gather form values
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const adults = parseInt(document.getElementById('adults').value);
      const pricePerAdult = parseFloat(document.getElementById('pricePerAdult').value);
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const status = document.getElementById('status').value;
      const notes = document.getElementById('notes').value;
      const totalPrice = adults * pricePerAdult;

      // Validate dates
      if (new Date(endDate) <= new Date(startDate)) {
        alert('End date must be after start date.');
        return;
      }

      // Create booking object
      const booking = {
        name,
        email,
        phone,
        adults,
        pricePerAdult,
        startDate,
        endDate,
        status,
        notes,
        totalPrice
      };

      // Send data to Sheet.Best
      try {
        const res = await fetch(SHEET_BEST_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(booking)
        });

        if (res.ok) {
          successMessage.style.display = 'block';
          errorMessage.style.display = 'none';
          form.reset();
        } else {
          throw new Error('Failed to submit');
        }
      } catch (err) {
        successMessage.style.display = 'none';
        errorMessage.style.display = 'block';
        console.error('Submission error:', err);
      }
    });
  </script>

</body>
</html>
